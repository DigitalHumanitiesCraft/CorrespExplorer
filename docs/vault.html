<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CorrespExplorer Promptotyping Vault - Destillierte Wissensdokumente aus der LLM-gestuetzten Entwicklung">
    <title>Promptotyping Vault - CorrespExplorer</title>
    <link rel="icon" type="image/png" href="assets/logo-no-background-no-text.png">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">

    <!-- Marked.js for Markdown rendering -->
    <script src="vendor/marked/marked.min.js"></script>

    <!-- Core CSS -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/shadows.css">

    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vault.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" role="navigation" aria-label="Hauptnavigation">
        <div class="nav-brand">
            <a href="index.html" class="nav-brand-link">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                <span class="visually-hidden">Zur Startseite: </span>
                <span class="brand-text">Promptotyping Vault</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="about.html" class="nav-link" title="About">
                <i class="fas fa-info-circle" aria-hidden="true"></i>
                <span class="nav-link-text">About</span>
            </a>
        </div>
    </nav>

    <div class="vault-container">
        <main class="vault-main">
            <aside class="vault-sidebar">
                <h3 id="doc-list-title"><i class="fas fa-folder-tree" aria-hidden="true"></i> Dokumente</h3>
                <nav class="doc-list" id="doc-list" aria-labelledby="doc-list-title">
                    <!-- Documents loaded by JS -->
                </nav>
            </aside>

            <article class="vault-content" id="vault-content">
                <div class="content-placeholder">
                    <i class="fas fa-file-lines" aria-hidden="true"></i>
                    <p>Waehlen Sie ein Dokument aus der Liste</p>
                </div>
            </article>
        </main>

    </div>

    <script src="js/vault.js" type="module"></script>
</body>
</html>
